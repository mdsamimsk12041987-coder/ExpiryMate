<title>ExpiryMate</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2233;--mut:#6b7488;--pri:#2a4bc0;--bd:#dfe4ee}
body.dark{--bg:#10141f;--card:#1a2030;--tx:#eef1f8;--mut:#9aa4ba;--bd:#2b3347}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;display:flex;align-items:center;gap:8px;height:56px;padding:0 8px}
header h1{font-size:19px;font-weight:500;margin:0;flex:1}
header button{background:none;border:0;color:#fff;font-size:22px;width:44px;height:44px;border-radius:50%}
main{max-width:640px;margin:0 auto;padding:14px;animation:in .2s}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.logo{text-align:center;padding:6px 0 14px}.logo b{font-size:30px;color:var(--pri)}.logo small{display:block;color:var(--mut)}
.tile{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:6px;color:#fff;font-size:18px;font-weight:500;padding:0 16px;height:58px;margin-bottom:10px;text-align:start}
.tile span:first-child{font-size:24px;width:30px}.tile em{margin-inline-start:auto;font-style:normal;background:rgba(255,255,255,.25);border-radius:14px;padding:2px 12px;font-size:15px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.item{display:flex;gap:12px;align-items:center;cursor:pointer}
.th{width:64px;height:64px;border-radius:8px;background:var(--bd);object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.item div.m{flex:1;min-width:0}.item b{display:block}.item small{color:var(--mut)}
.badge{border-radius:14px;padding:5px 12px;font-weight:600;font-size:14px;white-space:nowrap;color:#fff}
.safe{background:#1fa347}.soon{background:#ffcc1a;color:#222}.expired{background:#e0203a}.none{background:#8a93a6}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 14px;white-space:nowrap;font-size:15px}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
label{display:block;margin:12px 0 4px;font-weight:500}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
.btn{display:block;width:100%;border:0;border-radius:6px;color:#fff;font-size:17px;font-weight:500;font-family:inherit;padding:14px;margin-top:10px;background:var(--pri)}
.g{background:#1fa347}.r{background:#e0203a}.p{background:#5b34c9}.gr{background:#6b7488}
.row{display:flex;gap:8px}.row>*{flex:1}
.fab{position:fixed;inset-inline-end:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 3px 10px #0005}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.pv{width:100%;max-height:220px;object-fit:contain;border-radius:8px;background:var(--bd);margin-top:6px}
video{width:100%;border-radius:8px;background:#000;max-height:60vh}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.kv span:first-child{color:var(--mut)}
.err{color:#e0203a;font-size:14px;margin-top:4px}.note{color:var(--mut);font-size:14px;line-height:1.5}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:20;max-width:90%}
#toast.s{opacity:1}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:15;padding:20px}#modal.s{display:flex}#modal>div{background:var(--card);border-radius:12px;padding:16px;width:100%;max-width:380px}
</style>
</head>

'Alerts are checked when you open the app. Android browsers may not deliver them while the app is closed; reliable background alerts need a push server. Check the Notifications screen regularly.':['অ্যাপ খুললে সতর্কতা যাচাই করা হয়। অ্যাপ বন্ধ থাকলে Android ব্রাউজার নোটিফিকেশন নাও দিতে পারে; নির্ভরযোগ্য ব্যাকগ্রাউন্ড সতর্কতার জন্য পুশ সার্ভার লাগে। নিয়মিত বিজ্ঞপ্তি স্ক্রিন দেখুন।','ऐप खोलने पर अलर्ट जाँचे जाते हैं। ऐप बंद होने पर Android ब्राउज़र उन्हें न भेजे, ऐसा हो सकता है; भरोसेमंद बैकग्राउंड अलर्ट के लिए पुश सर्वर चाहिए। सूचनाएँ स्क्रीन नियमित देखें।','تُفحص التنبيهات عند فتح التطبيق. قد لا تصل الإشعارات عبر متصفحات أندرويد أثناء إغلاق التطبيق؛ والتنبيهات الخلفية الموثوقة تحتاج إلى خادم دفع. راجع شاشة الإشعارات بانتظام.','Las alertas se comprueban al abrir la app. Los navegadores Android pueden no entregarlas con la app cerrada; las alertas fiables en segundo plano requieren un servidor push. Revisa la pantalla de Notificaciones con frecuencia.'],

'Data':['ডেটা','डेटा','البيانات','Datos'],

function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const[y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d}

function status(type,it){const C=T[type],d=it[C.date];if(!d||!validDate(d))return{days:null,cls:'none',label:tr('No date'),txt:tr('No date set')};
 const n=new Date(),today=new Date(n.getFullYear(),n.getMonth(),n.getDate()),[y,m,dd]=d.split('-').map(Number);
 const days=Math.round((new Date(y,m-1,dd)-today)/864e5);
 if(days<0)return{days,cls:'expired',label:tr(C.over),txt:`${tr(C.over)}: ${dn(-days,'ago')}`};
 if(days<=C.soon)return{days,cls:'soon',label:days===0?tr('Today'):dn(days,''),txt:days===0?tr('Due today'):dn(days,'left')};
 return{days,cls:'safe',label:tr('Safe'),txt:dn(days,'left')}}
/* ---------- storage (IndexedDB) ---------- */
let db;const STORES=['products','warranty','returns','subs','docs','categories'];
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('expirymate',2);
 r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})});if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'})};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))})}
function tx(s,mode,f){return new Promise((res,rej)=>{const t=db.transaction(s,mode);let q;try{q=f(t.objectStore(s))}catch(e){return rej(e)}
 t.oncomplete=()=>res(q&&q.result);t.onerror=t.onabort=()=>rej(t.error)})}
const all=s=>tx(s,'readonly',o=>o.getAll()),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,id)=>tx(s,'readwrite',o=>o.delete(id)),clr=s=>tx(s,'readwrite',o=>o.clear());
const getSet=async(k,d)=>{const r=(await all('settings')).find(x=>x.key===k);return r?r.value:d};
const setSet=(k,v)=>put('settings',{key:k,value:v});
async function safe(fn){try{return await fn()}catch(e){console.error(e);toast(tr('Storage error: {0}',e.message||e));return null}}

const DEFID=n=>'def-'+n.toLowerCase().replace(/[^a-z0-9]+/g,'-');
const CATMAP={'fruits & veg':'Fruits & Vegetables','medicine':'Medicines'};
async function syncCats(){const cs=await all('categories'),names=new Set(cs.map(c=>c.name.toLowerCase()));
 for(const n of DEFCATS)if(!names.has(n.toLowerCase())){await put('categories',{id:DEFID(n),name:n,builtin:true});names.add(n.toLowerCase())}
 for(const p of await all('products')){let n=(p.category||'').trim();const m=CATMAP[n.toLowerCase()];
  if(m&&m!==p.category){p.category=m;await put('products',p);n=m}
  if(n&&!names.has(n.toLowerCase())){await put('categories',{id:uid(),name:n,builtin:false});names.add(n.toLowerCase())}}}
async function getCats(){const o=n=>DEFCATS.indexOf(n);return(await all('categories')).sort((a,b)=>{const x=a.builtin?o(a.name):999,y=b.builtin?o(b.name):999;return x-y||a.name.localeCompare(b.name)})}
function catTx(fn){return new Promise((res,rej)=>{const t=db.transaction(['categories','products'],'readwrite');fn(t.objectStore('categories'),t.objectStore('products'));t.oncomplete=res;t.onerror=t.onabort=()=>rej(t.error)})}
function moveProducts(ps,from,to){const rq=ps.getAll();rq.onsuccess=()=>rq.result.filter(p=>p.category===from).forEach(p=>{p.category=to;p.updated=Date.now();ps.put(p)})}
const renameCat=(c,n)=>catTx((cs,ps)=>{cs.put({...c,name:n});moveProducts(ps,c.name,n)});
const moveDel=(c,to)=>catTx((cs,ps)=>{moveProducts(ps,c.name,to);cs.delete(c.id)});

async function catEdit(id){const cs=await all('categories'),c=id&&cs.find(x=>x.id===id);

function shrink(file,max=900){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();
 i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);
  c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8))};
 i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('bad image'))};i.src=u})}

 const cnt={all:items.length,safe:items.filter(x=>x.s.cls=='safe').length,soon:items.filter(x=>x.s.cls=='soon').length,expired:items.filter(x=>x.s.cls=='expired').length};
 $('#app').innerHTML=`<input id="q" type="search" placeholder="${tr('Search…')}" value="${esc(q)}"><div class="chips" style="margin-top:10px">${[['all','All'],['safe','Safe'],['soon','Expiring Soon'],['expired',C.over]].map(([k,l])=>`<button class="chip ${flt==k?'on':''}" data-f="${k}">${tr(l)} (${cnt[k]})</button>`).join('')}</div>${type=='products'?`<div class="chips"><button class="chip ${catf=='all'?'on':''}" data-c="all">${tr('All categories')} (${items.length})</button>${cats.map(c=>`<button class="chip ${catf==c.name?'on':''}" data-c="${esc(c.name)}">${esc(catLabel(c.name))} (${items.filter(x=>x.it.category===c.name).length})</button>`).join('')}</div>`:''}<div id="ls"></div><button class="fab" onclick="go('#/form/${type}/new')" aria-label="${tr('Add')}">＋</button>`;
 const draw=()=>{const t=q.toLowerCase();let r=items.filter(x=>(flt=='all'||x.s.cls==flt)&&(catf=='all'||x.it.category===catf)&&(!t||JSON.stringify(x.it).replace(/data:image[^"]*/g,'').toLowerCase().includes(t)));
  r.sort((a,b)=>(a.it[C.date]||'9999').localeCompare(b.it[C.date]||'9999'));
  $('#ls').innerHTML=r.length?r.map(({it,s})=>`<div class="card item" onclick="go('#/detail/${type}/${it.id}')">${thumb(it,C)}<div class="m"><b>${esc(it.name)}</b><small>${esc(it.qty?it.qty+' '+tr(it.unit||''):it.brand||it.provider||it.seller||cv(type,it.category||''))}</small><br><small>${fmt(it[C.date])}</small></div><span class="badge ${s.cls}">${esc(s.label)}</span></div>`).join(''):`<div class="empty">${items.length?tr('No matching items.'):tr('Nothing here yet. Tap ＋ to add your first {0}.',tr(C.one).toLowerCase())}</div>`};
 draw();$('#q').oninput=e=>{q=e.target.value;draw()};
 document.querySelectorAll('.chip[data-f]').forEach(c=>c.onclick=()=>{flt=c.dataset.f;document.querySelectorAll('.chip[data-f]').forEach(x=>x.classList.toggle('on',x==c));draw()});
 document.querySelectorAll('.chip[data-c]').forEach(c=>c.onclick=()=>{catf=c.dataset.c;document.querySelectorAll('.chip[data-c]').forEach(x=>x.classList.toggle('on',x==c));draw()})}
/* ---------- form ---------- */
async function vForm(type,id){const C=T[type];if(!C)return go('#/home');
 const old=id&&id!=='new'?(await all(C.s)).find(x=>x.id===id):null;if(id&&id!=='new'&&!old){toast(tr('Item not found'));return go('#/list/'+type)}
 const v=old||pending||{};pending=null;ph=v.photo||null;if(!old&&type=='products'&&!v.qty)v.qty=1;
 head(tr(old?'Edit {0}':'Add {0}',tr(C.one)));const cats=type=='products'?(await getCats()).map(c=>c.name):[];if(type=='products'&&v.category&&!cats.includes(v.category))cats.push(v.category);
 const fld=([k,l,t,r,o])=>{if(type=='products'&&k=='category')o=cats;const val=esc(v[k]??'');let inp=t=='select'?`<select id="f_${k}">${o.map(x=>`<option value="${esc(x)}" ${v[k]==x?'selected':''}>${esc(type=='products'&&k=='category'?catLabel(x):tr(x))}</option>`).join('')}</select>`:t=='area'?`<textarea id="f_${k}" rows="3">${val}</textarea>`:`<input id="f_${k}" type="${t}" ${t=='number'?'min="0" step="any" inputmode="decimal"':''} value="${val}">`;
  return `<label>${tr(l)}${r?' *':''}</label>${inp}<div class="err" id="e_${k}"></div>`};
 $('#app').innerHTML=C.f.map(fld).join('')+(C.pl?`<label>${tr(C.pl)} (${tr('optional')})</label><div id="pv"></div><div class="row"><button class="btn gr" onclick="setPh(true)">${tr('📷 Camera')}</button><button class="btn gr" onclick="setPh(false)">${tr('🖼 Gallery')}</button><button class="btn r" onclick="ph=null;drawPh()">✕</button></div>`:'')+
  `<button class="btn g" id="sv">${esc(tr('Save {0}',tr(C.one)))}</button><button class="btn gr" onclick="history.back()">${tr('Cancel')}</button>`;
 drawPh();$('#sv').onclick=()=>safe(()=>save(type,old))}
function drawPh(){const e=$('#pv');if(e)e.innerHTML=ph?`<img class="pv" src="${ph}" alt="photo">`:''}
async function setPh(cam){const r=await pick(cam);if(r){ph=r;drawPh()}}
async function save(type,old){const C=T[type],o={};let bad=false;
 for(const[k,l,t,r]of C.f){const e=$('#e_'+k);e.textContent='';let x=$('#f_'+k).value.trim();
  if(r&&!x){e.textContent=tr('Required');bad=true}
  else if(t=='date'&&x&&!validDate(x)){e.textContent=tr('Invalid date');bad=true}
  else if(t=='number'&&x!==''&&(isNaN(+x)||+x<0)){e.textContent=tr('Enter a valid number');bad=true}
  o[k]=t=='number'&&x!==''?+x:x}
 if(!bad&&o.mfg&&o.expiry&&o.expiry<o.mfg){$('#e_expiry').textContent=tr('Expiry is before manufacturing date');bad=true}
 if(bad){toast(tr('Please fix the highlighted fields'));return}
 if(type=='products'){const dup=(await all('products')).find(x=>x.id!==(old&&old.id)&&((o.barcode&&x.barcode===o.barcode&&x.expiry===o.expiry)||(x.name.toLowerCase()===o.name.toLowerCase()&&x.expiry===o.expiry)));
  if(dup&&!confirm(tr('A similar product ("{0}") with the same expiry already exists. Save anyway?',dup.name)))return}
 const rec={...(old||{}),...o,id:old?old.id:uid(),photo:ph,created:old?old.created:Date.now(),updated:Date.now()};
 await put(C.s,rec);toast(tr('Saved'));history.replaceState(null,'','#/list/'+type);route()}
/* ---------- detail ---------- */
async function vDetail(type,id){const C=T[type];if(!C)return go('#/home');const it=(await all(C.s)).find(x=>x.id===id);if(!it){toast(tr('Item not found'));return go('#/list/'+type)}
 const s=status(type,it);head(tr('{0} Details',tr(C.one)),{acts:`<button onclick="go('#/form/${type}/${id}')" aria-label="${tr('Edit')}">✎</button><button onclick="rm('${type}','${id}')" aria-label="${tr('Delete')}">🗑</button>`});
 const rows=C.f.filter(f=>f[0]!='name'&&it[f[0]]!==''&&it[f[0]]!=null).map(([k,l,t])=>`<div class="kv"><span>${tr(l.replace(' (optional)',''))}</span><span>${esc(showVal(type,k,t,it[k]))}</span></div>`).join('');
 $('#app').innerHTML=`<div class="item card">${thumb(it,C)}<div class="m"><b style="font-size:20px">${esc(it.name)}</b><small>${tr('Added {0}',new Date(it.created||Date.now()).toLocaleDateString(LOC[LANG]))}</small></div></div>
 <div class="card"><div class="item"><div class="m"><b>${fmt(it[C.date])}</b><small>${esc(s.txt)}</small></div><span class="badge ${s.cls}">${esc(s.label)}</span></div></div><div class="card">${rows||'<span class="note">'+tr('No more details.')+'</span>'}</div>
 <button class="btn g" onclick="upDate('${type}','${id}')">${tr(type=='subs'?'Mark Renewed (advance date)':'Update Date')}</button>
 ${C.pl?`<button class="btn" onclick="newPh('${type}','${id}')">${tr('📷 Take New Photo')}</button>${it.photo?`<button class="btn p" onclick="fullImg('${type}','${id}')">${tr('View Full Image')}</button>`:''}`:''}
 <button class="btn r" onclick="rm('${type}','${id}')">${tr('Delete')}</button>`}
async function rm(type,id){if(!confirm(tr('Delete this item permanently?')))return;await safe(()=>del(T[type].s,id));toast(tr('Deleted'));history.replaceState(null,'','#/list/'+type);route()}
async function newPh(type,id){const r=await pick(true);if(!r)return;await safe(async()=>{const it=(await all(T[type].s)).find(x=>x.id===id);it.photo=r;it.updated=Date.now();await put(T[type].s,it);toast(tr('Photo updated'));route()})}
async function fullImg(type,id){const it=(await all(T[type].s)).find(x=>x.id===id);modal(`<img src="${it.photo}" style="width:100%;border-radius:8px"><button class="btn gr" onclick="modal()">${tr('Close')}</button>`)}
function modal(h){const m=$('#modal');if(!h){m.className='';return}$('#mbox').innerHTML=h;m.className='s'}
async function upDate(type,id){const C=T[type],it=(await all(C.s)).find(x=>x.id===id);
 if(type=='subs'){const d=new Date(it.renewal+'T00:00:00'),add={Monthly:1,Quarterly:3,Yearly:12}[it.cycle]||1;d.setMonth(d.getMonth()+add);it.renewal=`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;it.updated=Date.now();await put('subs',it);toast(tr('Renewal moved to {0}',fmt(it.renewal)));return route()}
 modal(`<label>${esc(tr('New {0}',tr(C.f.find(f=>f[0]==C.date)[1])))}</label><input type="date" id="nd" value="${esc(it[C.date]||'')}"><div class="err" id="nde"></div><button class="btn g" id="ndb">${tr('Save')}</button><button class="btn gr" onclick="modal()">${tr('Cancel')}</button>`);
 $('#ndb').onclick=()=>safe(async()=>{const v=$('#nd').value;if(!validDate(v)){$('#nde').textContent=tr('Enter a valid date');return}it[C.date]=v;it.updated=Date.now();await put(C.s,it);modal();toast(tr('Date updated'));route()})}
/* ---------- barcode ---------- */
async function vBarcode(){head('Scan Barcode');const hasBD='BarcodeDetector' in window;
 $('#app').innerHTML=`${hasBD?'<video id="vid" playsinline muted></video><p class="note" id="bs">'+tr('Starting camera…')+'</p>':'<p class="note">'+tr('Live barcode detection is not supported in this browser (works in recent Android Chrome). Enter the barcode manually below.')+'</p>'}
 <div id="res"></div><label>${tr('Enter barcode manually')}</label><input id="bc" inputmode="numeric" placeholder="e.g. 8901030690031"><button class="btn" id="bgo">${tr('Look Up')}</button><button class="btn gr" onclick="pending={};go('#/form/products/new')">${tr('Add Product Manually')}</button>
 <p class="note">${tr('Product names come from the free Open Food Facts database (food items only, no guarantee of coverage). If nothing is found, add the product manually.')}</p>`;
 $('#bgo').onclick=()=>{const c=$('#bc').value.replace(/\s/g,'');if(!/^\d{6,14}$/.test(c))return toast(tr('Enter 6–14 digits'));found(c)};
 if(!hasBD)return;
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#vid');v.srcObject=stream;await v.play();$('#bs').textContent=tr('Point the camera at a barcode.');
  const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','qr_code','code_128']});loopOn=true;
  const tick=async()=>{if(!loopOn)return;try{const r=await det.detect(v);if(r.length){loopOn=false;stopCam();return found(r[0].rawValue)}}catch(e){}setTimeout(tick,300)};tick()}
 catch(e){$('#bs').textContent=e.name=='NotAllowedError'?tr('Camera permission denied. Allow camera in browser settings, or enter the barcode manually.'):tr('Camera unavailable: {0}',e.message)}}
async function found(code){stopCam();const r=$('#res');r.innerHTML=`<div class="card"><b>${tr('Barcode Detected')}</b><br>${esc(code)}<br><span class="note">${tr('Looking up product…')}</span></div>`;
 let name='',qty='';try{const c=new AbortController();setTimeout(()=>c.abort(),8000);const j=await(await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,quantity`,{signal:c.signal})).json();if(j.status===1&&j.product&&j.product.product_name){name=j.product.product_name;qty=j.product.quantity||''}}catch(e){}
 const pre={barcode:code,name,notes:qty?tr('Pack size: {0}',qty):''};window._pre=pre;
 r.innerHTML=`<div class="card"><b>${tr('Barcode Detected')}</b><br>${esc(code)}<br>${name?`<b>${esc(name)}</b> ${esc(qty)}`:`<span class="note">${tr('Product not found online. You can enter details manually.')}</span>`}</div><button class="btn" onclick="pending=window._pre;go('#/form/products/new')">${tr(name?'Use This Product':'Enter Product Details')}</button>`}
/* ---------- OCR ---------- */
function parseDates(text){const out=[],re=/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})|(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/g;let m;
 while((m=re.exec(text))){let y,mo,d;if(m[1]){y=+m[1];mo=+m[2];d=+m[3]}else{d=+m[4];mo=+m[5];y=+m[6];if(y<100)y+=2000}
  const dt=new Date(y,mo-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)continue;
  const pre=text.slice(Math.max(0,m.index-14),m.index).toUpperCase();
  out.push({iso:`${y}-${p2(mo)}-${p2(d)}`,kind:/EXP|USE BY|BEST/.test(pre)?'EXP':/MFG|MFD|PKD|MANUF|PACK/.test(pre)?'MFG':'?'})}
 return out}
function loadTess(){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=res;s.onerror=()=>rej(new Error(tr('OCR library could not load (internet needed the first time)')));document.head.appendChild(s)})}
async function vOcr(){head('Scan with Camera');
 $('#app').innerHTML=`<p class="note">${tr('Take a clear, well-lit photo of the printed MFG / EXP dates. Dates are read as DD/MM/YYYY — please always check them.')}</p><div class="row"><button class="btn g" onclick="ocrGo(true)">${tr('📷 Camera')}</button><button class="btn" onclick="ocrGo(false)">${tr('🖼 Gallery')}</button></div><div id="oc"></div>`}
async function ocrGo(cam){const img=await pick(cam);if(!img)return;ph=img;const o=$('#oc');o.innerHTML=`<img class="pv" src="${img}" alt=""><p class="note" id="os">${tr('Loading text reader…')}</p>`;
 try{await loadTess();const r=await Tesseract.recognize(img,'eng',{logger:m=>{if(m.status=='recognizing text')$('#os').textContent=tr('Reading text… {0}%',Math.round(m.progress*100))}});
  const ds=parseDates(r.data.text),ex=ds.find(d=>d.kind=='EXP')||ds.find(d=>d.kind=='?'),mf=ds.find(d=>d.kind=='MFG');
  o.innerHTML=`<img class="pv" src="${img}" alt=""><div class="card"><b>${tr(ds.length?'Detected dates — please confirm':'No date detected')}</b><p class="note">${ds.map(d=>`${d.kind}: ${fmt(d.iso)}`).join(' • ')||tr('Enter the dates manually below.')}</p>
  <label>${tr('Manufacturing Date')}</label><input type="date" id="om" value="${mf?mf.iso:''}"><label>${tr('Expiry Date')}</label><input type="date" id="oe" value="${ex&&!(mf&&ex===mf)?ex.iso:''}"><div class="err" id="oer"></div></div>
  <button class="btn" id="ou">${tr('Use This Date')}</button>`;
  $('#ou').onclick=()=>{const e=$('#oe').value,m=$('#om').value;if(e&&!validDate(e)||m&&!validDate(m)||!e&&!m){$('#oer').textContent=tr('Enter at least one valid date');return}pending={expiry:e,mfg:m,photo:img};go('#/form/products/new')}}
 catch(e){o.innerHTML=`<img class="pv" src="${img}" alt=""><p class="err">${esc(e.message)}</p><button class="btn" onclick="pending={photo:ph};go('#/form/products/new')">${tr('Continue and enter dates manually')}</button>`}}
/* ---------- notifications ---------- */
async function buildAlerts(){const out=[];for(const type in T){const C=T[type];for(const it of await all(C.s)){const s=status(type,it);if(s.days==null||s.days>30)continue;
 const b=s.days<0?'exp':THRESH.find(t=>s.days<=t&&(THRESH[THRESH.indexOf(t)+1]===undefined||s.days>THRESH[THRESH.indexOf(t)+1]));
 out.push({key:`${type}:${it.id}:${C.date}:${it[C.date]}:${b}`,type,id:it.id,days:s.days,title:`${tr(C.t)}: ${s.days<0?tr(C.over):s.days===0?tr('Due today'):dn(s.days,'left')}`,body:`${it.name} — ${fmt(it[C.date])}`})}}
 return out.sort((a,b)=>a.days-b.days)}
async function runAlerts(){if(!('Notification' in window)||Notification.permission!=='granted'||!(await getSet('notif',true)))return;
 const done=new Set(await getSet('notified',[])),list=await buildAlerts(),reg=await navigator.serviceWorker?.getRegistration();let n=0;
 for(const a of list){if(done.has(a.key))continue;done.add(a.key);try{reg?await reg.showNotification(a.title,{body:a.body,icon:'icon-192.png',tag:a.key}):new Notification(a.title,{body:a.body});n++}catch(e){}}
 await setSet('notified',[...done].slice(-500))}
async function vAlerts(){head('Notifications',{acts:'<button onclick="go(\'#/settings\')">⚙</button>'});const l=await buildAlerts();
 $('#app').innerHTML=l.length?l.map(a=>`<div class="card item" onclick="go('#/detail/${a.type}/${a.id}')"><div class="th">${a.days<0?'⏰':'🔔'}</div><div class="m"><b>${esc(a.title)}</b><small>${esc(a.body)}</small></div></div>`).join(''):'<div class="empty">'+tr('No alerts. Items due within 30 days or overdue appear here.')+'</div>'}
/* ---------- settings / backup ---------- */
let dip=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e});
async function vSettings(){head('Settings');const perm='Notification' in window?Notification.permission:'unsupported';const on=await getSet('notif',true),dk=await getSet('dark',false);
 $('#app').innerHTML=`<div class="card"><b>${tr('Language')}</b><select id="lg" style="margin-top:8px">${LANGS.map(([c,n])=>`<option value="${c}" ${c==LANG?'selected':''}>${n}</option>`).join('')}</select></div>
 <div class="card"><b>${tr('Appearance')}</b><label><input type="checkbox" id="dk" style="width:auto" ${dk?'checked':''}> ${tr('Dark mode')}</label></div>
 <div class="card"><b>${tr('Reminders')}</b><p class="note">${tr('Alerts at 30, 7, 3 and 1 days before, on the day, and when overdue. Permission: {0}.','<b>'+tr(perm)+'</b>')}</p>
 <label><input type="checkbox" id="nt" style="width:auto" ${on?'checked':''}> ${tr('Enable notifications')}</label>${perm=='default'?`<button class="btn" id="np">${tr('Allow Notifications')}</button>`:''}
 <p class="note">${tr('Alerts are checked when you open the app. Android browsers may not deliver them while the app is closed; reliable background alerts need a push server. Check the Notifications screen regularly.')}</p></div>
 <div class="card"><b>${tr('Categories')}</b><button class="btn" onclick="go('#/categories')">${tr('Manage Categories')}</button></div>
 <div class="card"><b>${tr('Backup & Restore')}</b><button class="btn" id="ex">${tr('Export Backup (JSON)')}</button><button class="btn p" id="im">${tr('Import Backup')}</button></div>
 <div class="card"><b>${tr('Data')}</b><p class="note" id="st">…</p><p class="note">${tr('Your data is stored only in this browser on this device and is not synced. Clearing browser data can erase it — export backups regularly.')}</p><button class="btn r" id="ca">${tr('Delete All Data')}</button></div>
 ${dip?`<button class="btn g" id="ins">${tr('Install App')}</button>`:''}<p class="note" style="text-align:center">ExpiryMate 2.0</p>`;
 $('#lg').onchange=e=>safe(()=>setLang(e.target.value));
 $('#dk').onchange=e=>{document.body.classList.toggle('dark',e.target.checked);setSet('dark',e.target.checked)};
 $('#nt').onchange=e=>setSet('notif',e.target.checked);
 if($('#np'))$('#np').onclick=async()=>{await Notification.requestPermission();vSettings();runAlerts()};
 $('#ex').onclick=()=>safe(exportData);$('#im').onclick=importData;
 $('#ca').onclick=()=>safe(async()=>{if(!confirm(tr('Delete ALL data on this device? This cannot be undone.')))return;if(!confirm(tr('Really delete everything? Export a backup first if unsure.')))return;for(const s of STORES)await clr(s);await syncCats();toast(tr('All data deleted'));vSettings()});
 if($('#ins'))$('#ins').onclick=async()=>{dip.prompt();await dip.userChoice;dip=null;vSettings()};
 let t='';for(const s of STORES)t+=`${tr(SL[s])}: ${(await all(s)).length}  `;if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();t+='\n'+tr('Used ≈ {0} MB',(e.usage/1048576).toFixed(1))}$('#st').style.whiteSpace='pre-line';$('#st').textContent=t;
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}
async function exportData(){const data={};for(const s of STORES)data[s]=await all(s);const blob=new Blob([JSON.stringify({app:'ExpiryMate',version:3,exported:new Date().toISOString(),data})],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`expirymate-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast(tr('Backup exported'))}
function importData(){const i=document.createElement('input');i.type='file';i.accept='application/json,.json';i.onchange=async()=>{const f=i.files[0];if(!f)return;
 try{const j=JSON.parse(await f.text());if(j.app!=='ExpiryMate'||!j.data)throw new Error(tr('Not an ExpiryMate backup'));
  for(const s of STORES){if(j.data[s]===undefined)continue;if(!Array.isArray(j.data[s]))throw new Error(tr('Invalid data in {0}',s));
   for(const r of j.data[s])if(!r||typeof r.id!=='string'||typeof r.name!=='string')throw new Error(tr('Invalid record in {0}',s))}
  const c=STORES.map(s=>`${tr(SL[s])}: ${(j.data[s]||[]).length}`).join(', ');
  if(!confirm(tr('Restore this backup ({0})?\n\nThis REPLACES all current data on this device. Export a backup first if needed.',c)))return;
  for(const s of STORES){await clr(s);for(const r of j.data[s]||[])await put(s,r)}await syncCats();toast(tr('Backup restored'));vSettings()}
 catch(e){toast(tr('Import failed: {0}',e.message))}};i.click()}
/* ---------- start ---------- */
(async()=>{try{db=await openDB();await syncCats();LANG=await getSet('lang','en');if(!LOC[LANG])LANG='en';applyLang()}catch(e){$('#app').innerHTML='<div class="empty">'+tr('Storage is unavailable in this browser (private mode?).')+'<br>'+esc(e.message)+'</div>';return}
 if(await getSet('dark',false))document.body.classList.add('dark');
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW failed',e));
 await route();runAlerts()})();
</script>
